group: io.kestra.plugin.datagen.core
name: "core"
title: "Datagen Core"
description: "Tasks that generate synthetic records on demand or emit them continuously."
body: "Use `Generate` for inline values or batches stored in internal storage, `Trigger` for interval-based batches, and `RealtimeTrigger` for streaming at a controlled throughput. These generator-based tasks each need a `generator` (JSON, string, or bytes); key controls include `store` (defaults false), `batchSize` (defaults 1), `throughput`, `reportingInterval`, and `maxRecords` for caps. `Pseudonymize` is different: it reads an existing CSV, JSON, or ION file and replaces the listed PII fields with realistic fake values instead of generating new records."
